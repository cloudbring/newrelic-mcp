name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run linting
        run: npm run lint

      - name: Run type checking
        run: npm run typecheck

      - name: Run tests with coverage (and integration)
        if: matrix.node-version == '22.x'
        env:
          USE_REAL_ENV: true
          NEW_RELIC_API_KEY: ${{ secrets.NEW_RELIC_API_KEY }}
          NEW_RELIC_ACCOUNT_ID: ${{ vars.NEW_RELIC_ACCOUNT_ID }}
        run: npm run ai:test:coverage

      - name: Run unit tests (no integration)
        if: matrix.node-version != '22.x'
        run: npm run ai:test

      - name: Upload coverage reports to Codecov
        if: matrix.node-version == '22.x'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Upload HTML coverage as artifact
        if: always() && matrix.node-version == '22.x'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage
          if-no-files-found: warn
          retention-days: 7

      - name: Append coverage summary to job summary
        if: always() && matrix.node-version == '22.x'
        run: |
          echo '### Coverage Summary' >> $GITHUB_STEP_SUMMARY
          if [ -f coverage/coverage-summary.json ]; then
            node -e 'const s=require("./coverage/coverage-summary.json").total; console.log(`All files: statements ${s.statements.pct}% | branches ${s.branches.pct}% | functions ${s.functions.pct}% | lines ${s.lines.pct}%`)' >> $GITHUB_STEP_SUMMARY
          else
            echo 'coverage-summary.json not found' >> $GITHUB_STEP_SUMMARY
          fi

  build-and-publish:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing (OIDC) requires npm >= 11.5.1. Node 24 bundles npm 11,
      # but pin forward explicitly so the publish step never silently falls back
      # to token auth.
      - name: Ensure npm supports OIDC trusted publishing
        run: npm install -g npm@latest && npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check if version changed
        id: version-check
        run: |
          PUBLISHED_VERSION=$(npm view newrelic-mcp version 2>/dev/null || echo "0.0.0")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$PUBLISHED_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Version changed from $PUBLISHED_VERSION to $PACKAGE_VERSION"
            echo "version_changed=true" >> $GITHUB_OUTPUT
          else
            echo "Version unchanged: $PACKAGE_VERSION"
            echo "version_changed=false" >> $GITHUB_OUTPUT
          fi
          echo "package_version=$PACKAGE_VERSION" >> $GITHUB_OUTPUT

      # Auth comes from npm Trusted Publishing (OIDC) — no NODE_AUTH_TOKEN.
      # Provenance is generated automatically for OIDC publishes from public repos.
      - name: Publish to npm
        if: steps.version-check.outputs.version_changed == 'true'
        run: npm publish --access public

      - name: Pack npm tarball
        if: steps.version-check.outputs.version_changed == 'true'
        run: npm pack

      - name: Extract release notes from CHANGELOG
        if: steps.version-check.outputs.version_changed == 'true'
        id: notes
        run: |
          BODY=$(node scripts/extract-release-notes.mjs ${{ steps.version-check.outputs.package_version }})
          echo "body<<__EOF__" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "__EOF__" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.version-check.outputs.version_changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version-check.outputs.package_version }}
          name: v${{ steps.version-check.outputs.package_version }}
          files: newrelic-mcp-*.tgz
          body: ${{ steps.notes.outputs.body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
